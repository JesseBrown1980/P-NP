name: "P-NP mandatory native Rust 1.81 software acceptance"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pnp-native-rust181-gate:
    name: native-rust181-int-only-clippy-sources-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original trained model sources at frozen Git commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/Asolaria-fnns-trained-and-reverse-gnns-many
          ref: c4b2458c88358c46155d3b308c594f9991720847
          path: source-train
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout original scoring pipeline at frozen Git commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/Shannon-and-the-gnns-stage
          ref: 32f9670a648dbbd02d64524e91150efeec8e4d2c
          path: source-stage
          persist-credentials: false
          fetch-depth: 1
      - name: Pin exact Rust 1.81, offline sources and Clippy
        run: |
          set -euo pipefail
          rustup toolchain install 1.81.0 --profile minimal --component clippy --component rustfmt
          rustc +1.81.0 --version | tee RUST_PIN.hbp
          grep -Fq 'rustc 1.81.0 ' RUST_PIN.hbp
          test "$(grep -c '^\[\[package\]\]' native/Cargo.lock)" -eq 1
          test "$(find native -name Cargo.toml -type f | wc -l)" -eq 1
          test "$(find native -name Cargo.lock -type f | wc -l)" -eq 1
      - name: All native tests, zero-warning Clippy, and locked release build
        working-directory: native
        run: |
          set -euo pipefail
          cargo +1.81.0 test --all-targets --offline --locked
          cargo +1.81.0 clippy --all-targets --offline --locked -- -D warnings
          cargo +1.81.0 build --release --offline --locked
      - name: Reject drift in legacy implementations and any new non-Rust code
        run: |
          set -euo pipefail
          native/target/release/pnp-native audit . | tee PNP_AUDIT.hbp
          grep -Fq 'PNP_LEGACY_AUDIT|legacy_failed=54|python_scripts=44|old_workflows=10|' PNP_AUDIT.hbp
          grep -Fq '|software_status=LEGACY_FAIL|json=0' PNP_AUDIT.hbp
      - name: Independently scan executable project Rust source
        run: |
          set -euo pipefail
          if grep -nE '\b(f32|f64|serde_json|NodeJS|nodejs|javascript|v8)\b|unsafe[[:space:]]*\{' native/src/{lib,main,matrix,freeze,triad,ternary,guidance,solver,relic,source,sha256}.rs; then
            echo 'PNP_NATIVE_REJECT|reason=noninteger_or_nonrust_source|json=0'
            exit 1
          fi
          if git ls-files | grep -E '^native/.*\.(js|cjs|mjs|json|py|ts)$'; then
            echo 'PNP_NATIVE_REJECT|reason=external_runtime_in_native_path|json=0'
            exit 1
          fi
          echo 'PNP_SOURCE_INTEGER|float_types=0|unsafe_blocks=0|nodejs=0|json_runtime=0|v8=0|status=PASS|json=0'
      - name: Test frozen matrix, 2D shadow and all third-seat corrections
        run: |
          set -euo pipefail
          native/target/release/pnp-native certify | tee PNP_MATRIX.hbp
          grep -Fq 'PNP_NATIVE_MATRIX|architecture=Nx3x3x3|rooms=120|played_cells=3240|omega_centers=120|' PNP_MATRIX.hbp
          grep -Fq '|planted_faults_rejected=42|operator_approval=HELD|json=0' PNP_MATRIX.hbp
          grep -Fq 'PNP_NATIVE_WITNESS|ordered_triples=1080|balanced_faults_rejected=42|coordinated_reports_rejected=14|per_address_compare=PASS|signed_differences=EXACT|status=PASS|json=0' PNP_MATRIX.hbp
          grep -Fq 'PNP_NATIVE_FINAL|rust=1.81.0|integer_only=PASS|' PNP_MATRIX.hbp
          native/target/release/pnp-native certify > PNP_MATRIX_REPEAT.hbp
          cmp PNP_MATRIX.hbp PNP_MATRIX_REPEAT.hbp
          sha256sum PNP_MATRIX.hbp native/target/release/pnp-native > PNP_NATIVE_OUTPUT.sha256
          sha256sum -c PNP_NATIVE_OUTPUT.sha256
          echo 'PNP_DETERMINISM|byte_exact=PASS|replay=PASS|status=PASS|json=0'
      - name: Source-authenticated HBI HBP SHA SH HASH trained model receipts
        run: |
          set -euo pipefail
          native/target/release/pnp-native source-attest source-train source-stage evidence | tee SOURCE_ATTEST.hbp
          native/target/release/pnp-native source-verify evidence | tee SOURCE_VERIFY.hbp
          grep -Fq 'PNP_SOURCE_ATTEST|source_pins=23|model_checkpoints=9|manifest_checkpoints_sha=2|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|port=HOLD|status=PASS|json=0' SOURCE_ATTEST.hbp
          grep -Fq 'PNP_SOURCE_VERIFY|source_pins=23|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|status=PASS|json=0' SOURCE_VERIFY.hbp
          printf '%s  %s\n' '6f82384ff2e313b1f34b48cca5c1c2bb3a8f9391bba54db7afbb36c5fda91ad5' 'source-train/models/gslgnn_w9_3_seq47.pt' | sha256sum -c -
          printf '%s  %s\n' '9e50723b10c9de5c27baa5bc9386340bf72f76bcae2877064a47e4627a86602c' 'source-train/models/gslgnn_w9_3_seq47_v2.pt' | sha256sum -c -
          cp evidence/PNP_TRAINED_SOURCE.hbp "$RUNNER_TEMP/original-source.hbp"
          cp evidence/PNP_TRAINED_SOURCE.hbi "$RUNNER_TEMP/original-source.hbi"
          cp evidence/PNP_TRAINED_SOURCE.anchor "$RUNNER_TEMP/original-source.anchor"
          native/target/release/pnp-native source-attest source-train source-stage evidence > "$RUNNER_TEMP/repeated-attest.hbp"
          cmp evidence/PNP_TRAINED_SOURCE.hbp "$RUNNER_TEMP/original-source.hbp"
          cmp evidence/PNP_TRAINED_SOURCE.hbi "$RUNNER_TEMP/original-source.hbi"
          cmp evidence/PNP_TRAINED_SOURCE.anchor "$RUNNER_TEMP/original-source.anchor"
          ( cd evidence && sha256sum PNP_TRAINED_SOURCE.hbp PNP_TRAINED_SOURCE.hbi PNP_TRAINED_SOURCE.anchor > PNP_SOURCE_DIGESTS.sha256 )
          ( cd evidence && sha256sum -c PNP_SOURCE_DIGESTS.sha256 )
          echo 'PNP_SOURCE_REPLAY|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|replay=PASS|json=0'
      - name: Source and index tamper negatives against native verifier
        run: |
          set -euo pipefail
          for path in PNP_TRAINED_SOURCE.hbp PNP_TRAINED_SOURCE.hbi PNP_TRAINED_SOURCE.anchor; do
            cp "evidence/$path" "$RUNNER_TEMP/$path"
            printf 'X' >> "evidence/$path"
            if native/target/release/pnp-native source-verify evidence > "$RUNNER_TEMP/source-tamper.hbp" 2>&1; then
              echo "PNP_SOURCE_TAMPER_FAIL|file=$path|json=0"
              exit 1
            fi
            cp "$RUNNER_TEMP/$path" "evidence/$path"
          done
          cp source-train/models/gslgnn_w9_3_seq47_v2.pt "$RUNNER_TEMP/original-gsl.pt"
          printf 'X' >> source-train/models/gslgnn_w9_3_seq47_v2.pt
          if native/target/release/pnp-native source-attest source-train source-stage evidence > "$RUNNER_TEMP/checkpoint-tamper.hbp" 2>&1; then
            echo 'PNP_SOURCE_TAMPER_FAIL|file=checkpoint|json=0'
            exit 1
          fi
          cp "$RUNNER_TEMP/original-gsl.pt" source-train/models/gslgnn_w9_3_seq47_v2.pt
          native/target/release/pnp-native source-verify evidence >/dev/null
          ( cd evidence && sha256sum -c PNP_SOURCE_DIGESTS.sha256 )
          echo 'PNP_SOURCE_NEGATIVE|hbp=REJECTED|hbi=REJECTED|anchor=REJECTED|checkpoint=REJECTED|restored=PASS|json=0'
      - name: Relic rediscovery source-exact integer wave and frozen center replays
        run: |
          set -euo pipefail
          native/target/release/pnp-native relic | tee PNP_RELIC.hbp
          grep -Fq 'RELIC_NATIVE|level=0|center=1|center_coordinate=0|outward=27|waves=[81, 243]|next=243|status=PASS|json=0' PNP_RELIC.hbp
          grep -Fq 'RELIC_NATIVE_FINAL|landings=5|invariant_center=PASS|exact_integers=PASS|status=PASS|json=0' PNP_RELIC.hbp
          native/target/release/pnp-native relic > PNP_RELIC_REPEAT.hbp
          cmp PNP_RELIC.hbp PNP_RELIC_REPEAT.hbp
      - name: Nine native ternary engines on SAT, UNSAT, PHP and budget HOLDs
        run: |
          set -euo pipefail
          : > PNP_TERNARY.hbp
          for arm in base mtp fischer nest3 nest27 nest81 hybrid3 hybrid27 hybrid81; do
            native/target/release/pnp-native sat "$arm" native/fixtures/sat3.cnf | tee -a PNP_TERNARY.hbp
            native/target/release/pnp-native sat "$arm" native/fixtures/unsat2.cnf | tee -a PNP_TERNARY.hbp
            native/target/release/pnp-native sat "$arm" native/fixtures/php4_3.cnf | tee -a PNP_TERNARY.hbp
            native/target/release/pnp-native sat "$arm" native/fixtures/php4_3.cnf 0 | tee -a PNP_TERNARY.hbp
            grep -Fq "PNP_TERNARY_SAT|engine=$arm|" PNP_TERNARY.hbp
          done
          test "$(grep -c '|status=SAT|json=0' PNP_TERNARY.hbp)" -eq 9
          test "$(grep -c '|status=UNSAT|json=0' PNP_TERNARY.hbp)" -eq 18
          test "$(grep -c '|status=HOLD_RESOURCE|json=0' PNP_TERNARY.hbp)" -eq 9
          test "$(grep -c 'PNP_TERNARY_MODEL|engine=' PNP_TERNARY.hbp)" -eq 9
          cp PNP_TERNARY.hbp PNP_TERNARY_ORIGINAL.hbp
          : > PNP_TERNARY.hbp
          for arm in base mtp fischer nest3 nest27 nest81 hybrid3 hybrid27 hybrid81; do
            native/target/release/pnp-native sat "$arm" native/fixtures/sat3.cnf >> PNP_TERNARY.hbp
            native/target/release/pnp-native sat "$arm" native/fixtures/unsat2.cnf >> PNP_TERNARY.hbp
            native/target/release/pnp-native sat "$arm" native/fixtures/php4_3.cnf >> PNP_TERNARY.hbp
            native/target/release/pnp-native sat "$arm" native/fixtures/php4_3.cnf 0 >> PNP_TERNARY.hbp
          done
          cmp PNP_TERNARY.hbp PNP_TERNARY_ORIGINAL.hbp
          echo 'PNP_TERNARY_ACCEPT|engines=9|sat=9|unsat=18|budget_holds=9|models_original=PASS|replay=PASS|json=0'
      - name: Scan compiled LLVM IR for floating arithmetic instructions
        working-directory: native
        run: |
          set -euo pipefail
          cargo +1.81.0 rustc --release --offline --locked --lib -- --emit=llvm-ir
          count=$(find target/release/deps -name 'pnp_native-*.ll' -type f | wc -l)
          test "$count" -ge 1
          if grep -nE '(^|[[:space:]])(fadd|fsub|fmul|fdiv|frem|fcmp)[[:space:]]|@llvm\.(sqrt|fma|fmuladd)\.' target/release/deps/pnp_native-*.ll; then
            echo 'PNP_COMPILED_REJECT|reason=float_ir_instruction|json=0'
            exit 1
          fi
          echo "PNP_COMPILED_INTEGER|project_ir_scanned=$count|float_ir_instructions=0|status=PASS|json=0"
      - name: Plant source-tamper and foreign runtime negatives
        run: |
          set -euo pipefail
          cp sat/engine.py "$RUNNER_TEMP/original-engine.py"
          trap 'cp "$RUNNER_TEMP/original-engine.py" sat/engine.py; git reset -q -- intent_new_runtime.py >/dev/null 2>&1 || :; rm -f intent_new_runtime.py' EXIT
          printf '\n# adversarial tamper\n' >> sat/engine.py
          if native/target/release/pnp-native audit . >"$RUNNER_TEMP/TAMPER_LEGACY.hbp" 2>&1; then
            echo 'PNP_NEGATIVE_FAIL|legacy_tamper_not_detected|json=0'
            exit 1
          fi
          grep -Fq 'historical source changed' "$RUNNER_TEMP/TAMPER_LEGACY.hbp"
          cp "$RUNNER_TEMP/original-engine.py" sat/engine.py
          printf 'print(1)\n' > intent_new_runtime.py
          git add -N intent_new_runtime.py
          if native/target/release/pnp-native audit . >"$RUNNER_TEMP/TAMPER_RUNTIME.hbp" 2>&1; then
            echo 'PNP_NEGATIVE_FAIL|new_nonrust_not_detected|json=0'
            exit 1
          fi
          grep -Fq 'non-native executable is not accepted' "$RUNNER_TEMP/TAMPER_RUNTIME.hbp"
          git reset -q -- intent_new_runtime.py
          rm intent_new_runtime.py
          native/target/release/pnp-native audit . >"$RUNNER_TEMP/RESTORE.hbp"
          echo 'PNP_NEGATIVE_CONTROLS|legacy_source_tamper=REJECTED|new_nonrust_runtime=REJECTED|restored=PASS|json=0'
      - name: Source-provenance and immutable HBP evidence archive
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp RUST_PIN.hbp PNP_AUDIT.hbp PNP_MATRIX.hbp PNP_MATRIX_REPEAT.hbp PNP_NATIVE_OUTPUT.sha256 PNP_RELIC.hbp PNP_RELIC_REPEAT.hbp PNP_TERNARY.hbp PNP_TERNARY_ORIGINAL.hbp SOURCE_ATTEST.hbp SOURCE_VERIFY.hbp evidence/
          git rev-parse HEAD > evidence/SOURCE_COMMIT.hbp
          git ls-files > evidence/TRACKED_SOURCES.hbi
          sha256sum native/Cargo.toml native/Cargo.lock native/rust-toolchain.toml policy/LEGACY_PINNED.hbp policy/TRAINED_SOURCE_PINS.hbi > evidence/SOURCE_PINS.sha256
          ( cd evidence && find . -type f ! -name FINAL_MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > FINAL_MANIFEST.sha256 )
          ( cd evidence && sha256sum -c FINAL_MANIFEST.sha256 )
          echo 'PNP_NATIVE_CERTIFICATE|rust=1.81.0|clippy_zero_warning=PASS|integer_only=PASS|legacy=FAIL_NATIVE_ACCEPTANCE|native_pilot=PASS|json=0'
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-native-rust181-software-acceptance-evidence
          path: evidence/
          retention-days: 90
          if-no-files-found: error
  archive-independent-recheck:
    name: published-evidence-independent-check
    needs: pnp-native-rust181-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pnp-native-rust181-software-acceptance-evidence
          path: accepted
      - name: Independently recheck published original source and byte-exact evidence
        run: |
          set -euo pipefail
          cd accepted
          sha256sum -c FINAL_MANIFEST.sha256 >/dev/null
          sha256sum -c PNP_SOURCE_DIGESTS.sha256 >/dev/null
          grep -Fq 'PNP_SOURCE_ATTEST|source_pins=23|model_checkpoints=9|manifest_checkpoints_sha=2|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|port=HOLD|status=PASS|json=0' SOURCE_ATTEST.hbp
          grep -Fq 'PNP_SOURCE_VERIFY|source_pins=23|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|status=PASS|json=0' SOURCE_VERIFY.hbp
          test "$(grep -c '^HBI|' PNP_TRAINED_SOURCE.hbi)" -eq 23
          test "$(grep -c '^MODEL_SOURCE|' PNP_TRAINED_SOURCE.hbp)" -eq 23
          grep -Fq 'seal=HBI-HBP-SHA-SH-HASH' PNP_TRAINED_SOURCE.anchor
          root_bp=$(sed -n 's/.*|root_hbp_sha256=\([0-9a-f]*\)|.*/\1/p' PNP_TRAINED_SOURCE.anchor)
          root_bi=$(sed -n 's/.*|root_hbi_sha256=\([0-9a-f]*\)|.*/\1/p' PNP_TRAINED_SOURCE.anchor)
          test "$root_bp" = "$(sha256sum PNP_TRAINED_SOURCE.hbp | cut -d' ' -f1)"
          test "$root_bi" = "$(sha256sum PNP_TRAINED_SOURCE.hbi | cut -d' ' -f1)"
          grep -Fq 'PNP_NATIVE_FINAL|rust=1.81.0|integer_only=PASS|' PNP_MATRIX.hbp
          grep -Fq 'PNP_NATIVE_WITNESS|ordered_triples=1080|balanced_faults_rejected=42|coordinated_reports_rejected=14|' PNP_MATRIX.hbp
          cmp PNP_MATRIX.hbp PNP_MATRIX_REPEAT.hbp
          cmp PNP_RELIC.hbp PNP_RELIC_REPEAT.hbp
          cmp PNP_TERNARY.hbp PNP_TERNARY_ORIGINAL.hbp
          grep -Fq 'RELIC_NATIVE_FINAL|landings=5|invariant_center=PASS|' PNP_RELIC.hbp
          test "$(grep -c '|status=UNSAT|json=0' PNP_TERNARY.hbp)" -eq 18
          grep -Fq '|software_status=LEGACY_FAIL|json=0' PNP_AUDIT.hbp
          echo 'PNP_NATIVE_ARCHIVE|locked_rust=1.81.0|reproducible=PASS|sha256=PASS|status=PASS|json=0'
