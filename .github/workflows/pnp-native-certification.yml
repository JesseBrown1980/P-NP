name: "P-NP mandatory native Rust 1.81 software acceptance"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pnp-native-rust181-gate:
    name: native-rust181-int-only-clippy-sources-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original trained model sources at frozen Git commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/Asolaria-fnns-trained-and-reverse-gnns-many
          ref: c4b2458c88358c46155d3b308c594f9991720847
          path: source-train
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout original scoring pipeline at frozen Git commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/Shannon-and-the-gnns-stage
          ref: 32f9670a648dbbd02d64524e91150efeec8e4d2c
          path: source-stage
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout GAC authority and 60D tuple sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/Asolaria-gac-working
          ref: 4def18c4bf103a7b5df54c3c0eca7f1d0135b7b4
          path: source-gac
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout original Asolaria neural-fabric law
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/ASOLARIA-AS-NEURAL-NETWORK
          ref: 4cc7624fb51ff8a64051ace7a1ff62edaa51d422
          path: source-neural
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout original Omni GC/Gulp source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/asolaria-behcs-256
          ref: 818cc235a6db815e3b2591339cf9b42aad3e85a0
          path: source-omni
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout original Q-PRISM Rust Host8 code at frozen Git commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/Q-PRISM-human-organoid-neural-stream-as-a-high-dimensional-control
          ref: b4a21a25381d6920b7aab92c94c3c3e1420fc9e4
          path: source-prism
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout original Omnibit six-vantage tournament and operator catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: JesseBrown1980/asolaria-omega-omnibit-tournament
          ref: dad4647ad19a1b08ee90990c34aab1255f9a6046
          path: source-omnibit
          persist-credentials: false
          fetch-depth: 1
      - name: Pin exact Rust 1.81, offline sources and Clippy
        run: |
          set -euo pipefail
          rustup toolchain install 1.81.0 --profile minimal --component clippy --component rustfmt
          rustc +1.81.0 --version | tee RUST_PIN.hbp
          grep -Fq 'rustc 1.81.0 ' RUST_PIN.hbp
          test "$(grep -c '^\[\[package\]\]' native/Cargo.lock)" -eq 1
          test "$(find native -name Cargo.toml -type f | wc -l)" -eq 1
          test "$(find native -name Cargo.lock -type f | wc -l)" -eq 1
      - name: All native tests, zero-warning Clippy, and locked release build
        working-directory: native
        run: |
          set -euo pipefail
          cargo +1.81.0 test --all-targets --offline --locked
          cargo +1.81.0 clippy --all-targets --offline --locked -- -D warnings
          cargo +1.81.0 build --release --offline --locked
      - name: Reject drift in legacy implementations and any new non-Rust code
        run: |
          set -euo pipefail
          native/target/release/pnp-native audit . | tee PNP_AUDIT.hbp
          grep -Fq 'PNP_LEGACY_AUDIT|legacy_failed=54|python_scripts=44|old_workflows=10|' PNP_AUDIT.hbp
          grep -Fq '|software_status=LEGACY_FAIL|json=0' PNP_AUDIT.hbp
      - name: Source-locked OmniMets convergence and five-shell MCP star-language acceptance
        run: |
          set -euo pipefail
          test "$(git -C source-omni hash-object packages/omnimets/src/mets.ts)" = "49bd2c7daec59a8301fd6010f5fdefa11ec2da00"
          test "$(git -C source-omni hash-object packages/omnimets/src/convergence.ts)" = "c29da7ac6ce6b50af20c552915b67442df565c37"
          native/target/release/pnp-native layered-sphere-attest | tee PNP_LAYERED_SPHERE.hbp
          grep -Fq 'PNP_LAYERED_SPHERE|schema=v1|rooms=120|floors=600|transitions=480|microkernel_gulps=1440|nested_child_presentations=360|star_glyphs=5400|' PNP_LAYERED_SPHERE.hbp
          grep -Fq '|fischer_arbitrary_null_checks=360|rejected=120|language_ladder=64_256_1024_4096_16384|symbol_not_bit=PASS|ternary_prism_inverse=PASS|qprism=PASS|omnibit40=PASS|post_gulp_clear=PASS|watcher=INDEPENDENT_INTEGER|trained_gnn=HOLD_FORWARD|status=PASS|json=0' PNP_LAYERED_SPHERE.hbp
          grep -Fq 'PNP_OMNIMETS_NATIVE|schema=v1|source_commit=818cc235a6db815e3b2591339cf9b42aad3e85a0|lanes=7|dispatches=1440|promotions=1320|deferrals=120|halts=120|errors=120|samples=1440|ratifications=120|seals=120|k=3|ratify_before_seal=PASS|real_microkernel=PASS|source_immutable=PASS|trained_gnn=HOLD_FORWARD|status=PASS|json=0' PNP_LAYERED_SPHERE.hbp
          test "$(grep -c '^OMNIMETS_LANE|lane=' PNP_LAYERED_SPHERE.hbp)" -eq 7
          grep -Fq 'OMNIMETS_SHA|body_sha256=' PNP_LAYERED_SPHERE.hbp
      - name: Brown Ledger Shannon-paid forward/reverse frozen matrix and null-outward N-Nest gate
        run: |
          set -euo pipefail
          native/target/release/pnp-native brown-ledger-attest | tee PNP_BROWN_LEDGER.hbp
          grep -Fq 'PNP_BROWN_LEDGER|schema=v1|rooms=120|verified_cells=3240|' PNP_BROWN_LEDGER.hbp
          grep -Fq '|tamper_rejections=244|prism_floor_roundtrips=120|' PNP_BROWN_LEDGER.hbp
          grep -Fq '|fischer_null_outward=PASS|fischer_prime_towers=PASS|freeze_play_reverse=PASS|ternary_binary=PASS|nested_three_seat=PASS|shannon=PAID_METADATA_AND_CLOSURE|trained_gnn=HOLD_FORWARD|status=PASS|json=0' PNP_BROWN_LEDGER.hbp
      - name: Fetch and verify the original Constellation kernels, keys, master table, and disk GGUF
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/constellation"
          mkdir -p "$root/kernel-and-key" "$root/master-key" "$root/rust/src" "$root/ggufs"
          upstream="https://raw.githubusercontent.com/JesseBrown1980/Quant-anything-0-loss/e979ebe114f32c5b6ab9c2325e252c4b8ce28ddd"
          while IFS= read -r file; do
            test -n "$file" || continue
            curl --fail --location --retry 3 --silent --show-error "$upstream/$file" --output "$root/$file"
          done <<'SOURCES'
          kernel-and-key/ASOLARIA-KERNEL-3174.bin
          kernel-and-key/ASOLARIA-KERNEL-3174.kernel-pump-copy.bin
          kernel-and-key/ASOLARIA-CONSTELLATION-KEY-3174.bin
          master-key/masterkey.xz
          master-key/order.txt
          master-key/stream.bin
          rust/Cargo.toml
          rust/src/main.rs
          ggufs/gguf__axes__ASOLARIA-FOUR-AXES-RIME.gguf
          SOURCES
          cat > "$root/PUBLISHED.sha256" <<'SHA'
          202ff2f06af54788958a03f60245593f89a88b0a3a4fc76435ad8468f151dc98  kernel-and-key/ASOLARIA-KERNEL-3174.bin
          f075f5c64d656ae3afa91c793ab2c74b5425e41de141d6b7dc5cf4605663b0ca  kernel-and-key/ASOLARIA-KERNEL-3174.kernel-pump-copy.bin
          cce4f1e8ae407f108b5c122e764f0b4c3882ce059cf900a0cc1b2a0e7588c1ea  kernel-and-key/ASOLARIA-CONSTELLATION-KEY-3174.bin
          567d937b8942aaaf5fc95a752ddf1ecc40a51031867834dfc4515467b7702f77  master-key/masterkey.xz
          d4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35  master-key/order.txt
          e3290c1052b0cbd7583bc89ca4af5c5f3eb7db081cc9ef46e1cfcf8ce6b29d1b  master-key/stream.bin
          9fe92da2b064e39ad52b389fb92d0c59739e1fd7d9db5b82c6d25c0ebf8fa735  ggufs/gguf__axes__ASOLARIA-FOUR-AXES-RIME.gguf
          SHA
          (cd "$root" && sha256sum -c PUBLISHED.sha256)
          for name in ASOLARIA-KERNEL-3174.bin ASOLARIA-KERNEL-3174.kernel-pump-copy.bin ASOLARIA-CONSTELLATION-KEY-3174.bin; do
            test "$(wc -c < "$root/kernel-and-key/$name")" -eq 3174
          done
          ! cmp -s "$root/kernel-and-key/ASOLARIA-KERNEL-3174.bin" "$root/kernel-and-key/ASOLARIA-KERNEL-3174.kernel-pump-copy.bin"
          test "$(cat "$root/master-key/order.txt")" = 2
          test "$(wc -c < "$root/ggufs/gguf__axes__ASOLARIA-FOUR-AXES-RIME.gguf")" -eq 4908
          test "$(head -c 4 "$root/ggufs/gguf__axes__ASOLARIA-FOUR-AXES-RIME.gguf")" = "GGUF"
          xz -t "$root/master-key/masterkey.xz"
          xz -dc "$root/master-key/masterkey.xz" > "$root/master-key/key.raw"
          test "$(wc -c < "$root/master-key/key.raw")" -eq 33554432
          echo 'CONSTELLATION_SOURCE|kernels=2_DISTINCT|constellation_key=3174|master_xz=549112|master_raw=33554432|small_gguf=4908|original_source=GIT_PINNED|sha256=PASS|json=0'
      - name: Use original 256-outcome Rust decoder with real master table
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/constellation"
          (cd "$root/rust" && cargo +1.81.0 build --offline --release)
          engine="$root/rust/target/release/asolaria_codex"
          "$engine" dec "$root/master-key/key.raw" 2 "$root/master-key/stream.bin" 4194304 "$root/decoded.bin" | tee "$root/DECODE.hbp"
          test "$(wc -c < "$root/decoded.bin")" -eq 4194304
          printf '5ba647fec2ba51b0383cbe7147e15a478d85613245b7131c41764dbdd5062f77  %s\n' "$root/decoded.bin" | sha256sum -c
          grep -Fq 'DEC|decoded_bytes=4194304|decoded_sha256=5ba647fec2ba51b0383cbe7147e15a478d85613245b7131c41764dbdd5062f77|inputs=key_and_stream_only|' "$root/DECODE.hbp"
          if "$engine" dec "$root/master-key/absent.key" 2 "$root/master-key/stream.bin" 4194304 "$root/missing.bin"; then exit 1; fi
          if "$engine" dec "$root/master-key/key.raw" 1 "$root/master-key/stream.bin" 4194304 "$root/wrong-order.bin"; then exit 1; fi
          cp "$root/master-key/stream.bin" "$root/truncated.bin"
          truncate -s 32 "$root/truncated.bin"
          "$engine" dec "$root/master-key/key.raw" 2 "$root/truncated.bin" 4194304 "$root/truncated-output.bin" > "$root/TRUNCATED.hbp" || true
          if test -f "$root/truncated-output.bin" && printf '5ba647fec2ba51b0383cbe7147e15a478d85613245b7131c41764dbdd5062f77  %s\n' "$root/truncated-output.bin" | sha256sum -c > /dev/null 2>&1; then
            echo 'Truncated source unexpectedly reproduced complete source' >&2
            exit 1
          fi
          echo 'CONSTELLATION_DECODE|alphabet=256|order=2|bytes=4194304|sha256=PASS|master_table=SOURCE_ORIGINAL|missing_key=REJECTED|wrong_model_order=REJECTED|truncated_stream=REJECTED|gpu=NOT_REQUIRED|json=0'
          mkdir -p evidence
          cp "$root/PUBLISHED.sha256" "$root/DECODE.hbp" evidence/
      - name: Independently scan executable project Rust source
        run: |
          set -euo pipefail
          if grep -nE '\b(f32|f64|serde_json|NodeJS|nodejs|javascript|v8)\b|unsafe[[:space:]]*\{' native/src/{lib,main,matrix,freeze,triad,ternary,guidance,solver,relic,source,sha256,wave,scoring,ensemble,checkpoint,fabric_gc,prism,gc_archive,gulp_gc,binary_ternary_bridge,omnibit_tournament,omega_operator_catalog,omnibit_operator_gate,tls_memory,tls_stochastic,tls_omnibit_gc,tls_entropy_omnibit,tls_stream_fabric,http0_fabric_witness,http0_compute,microkernel_compute,matrix_wire,full_matrix_fabric,temporal_fabric,prl_temporal_fabric}.rs; then
            echo 'PNP_NATIVE_REJECT|reason=noninteger_or_nonrust_source|json=0'
            exit 1
          fi
          if git ls-files | grep -E '^native/.*\.(js|cjs|mjs|json|py|ts)$'; then
            echo 'PNP_NATIVE_REJECT|reason=external_runtime_in_native_path|json=0'
            exit 1
          fi
          echo 'PNP_SOURCE_INTEGER|float_types=0|unsafe_blocks=0|nodejs=0|json_runtime=0|v8=0|status=PASS|json=0'
      - name: Test frozen matrix, 2D shadow and all third-seat corrections
        run: |
          set -euo pipefail
          native/target/release/pnp-native certify | tee PNP_MATRIX.hbp
          grep -Fq 'PNP_NATIVE_MATRIX|architecture=Nx3x3x3|rooms=120|played_cells=3240|omega_centers=120|' PNP_MATRIX.hbp
          grep -Fq '|planted_faults_rejected=42|operator_approval=HELD|json=0' PNP_MATRIX.hbp
          grep -Fq 'PNP_NATIVE_WITNESS|ordered_triples=1080|balanced_faults_rejected=42|coordinated_reports_rejected=14|per_address_compare=PASS|signed_differences=EXACT|status=PASS|json=0' PNP_MATRIX.hbp
          grep -Fq 'PNP_NATIVE_WAVE|rooms=120|path_decisions=426|signed_children=1278|center=1|addressed_lazy=PASS|third_seat=PASS|altered_paths=REJECTED|status=PASS|json=0' PNP_MATRIX.hbp
          grep -Fq 'PNP_NATIVE_FINAL|rust=1.81.0|integer_only=PASS|' PNP_MATRIX.hbp
          native/target/release/pnp-native certify > PNP_MATRIX_REPEAT.hbp
          cmp PNP_MATRIX.hbp PNP_MATRIX_REPEAT.hbp
          sha256sum PNP_MATRIX.hbp native/target/release/pnp-native > PNP_NATIVE_OUTPUT.sha256
          sha256sum -c PNP_NATIVE_OUTPUT.sha256
          echo 'PNP_DETERMINISM|byte_exact=PASS|replay=PASS|status=PASS|json=0'
      - name: Source-authenticated HBI HBP SHA SH HASH trained model receipts
        run: |
          set -euo pipefail
          native/target/release/pnp-native source-attest source-train source-stage evidence | tee SOURCE_ATTEST.hbp
          native/target/release/pnp-native source-verify evidence | tee SOURCE_VERIFY.hbp
          grep -Fq 'PNP_SOURCE_ATTEST|source_pins=23|model_checkpoints=9|manifest_checkpoints_sha=2|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|port=HOLD|status=PASS|json=0' SOURCE_ATTEST.hbp
          grep -Fq 'PNP_SOURCE_VERIFY|source_pins=23|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|status=PASS|json=0' SOURCE_VERIFY.hbp
          printf '%s  %s\n' '6f82384ff2e313b1f34b48cca5c1c2bb3a8f9391bba54db7afbb36c5fda91ad5' 'source-train/models/gslgnn_w9_3_seq47.pt' | sha256sum -c -
          printf '%s  %s\n' '9e50723b10c9de5c27baa5bc9386340bf72f76bcae2877064a47e4627a86602c' 'source-train/models/gslgnn_w9_3_seq47_v2.pt' | sha256sum -c -
          cp evidence/PNP_TRAINED_SOURCE.hbp "$RUNNER_TEMP/original-source.hbp"
          cp evidence/PNP_TRAINED_SOURCE.hbi "$RUNNER_TEMP/original-source.hbi"
          cp evidence/PNP_TRAINED_SOURCE.anchor "$RUNNER_TEMP/original-source.anchor"
          native/target/release/pnp-native source-attest source-train source-stage evidence > "$RUNNER_TEMP/repeated-attest.hbp"
          cmp evidence/PNP_TRAINED_SOURCE.hbp "$RUNNER_TEMP/original-source.hbp"
          cmp evidence/PNP_TRAINED_SOURCE.hbi "$RUNNER_TEMP/original-source.hbi"
          cmp evidence/PNP_TRAINED_SOURCE.anchor "$RUNNER_TEMP/original-source.anchor"
          ( cd evidence && sha256sum PNP_TRAINED_SOURCE.hbp PNP_TRAINED_SOURCE.hbi PNP_TRAINED_SOURCE.anchor > PNP_SOURCE_DIGESTS.sha256 )
          ( cd evidence && sha256sum -c PNP_SOURCE_DIGESTS.sha256 )
          echo 'PNP_SOURCE_REPLAY|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|replay=PASS|json=0'
      - name: Source and index tamper negatives against native verifier
        run: |
          set -euo pipefail
          for path in PNP_TRAINED_SOURCE.hbp PNP_TRAINED_SOURCE.hbi PNP_TRAINED_SOURCE.anchor; do
            cp "evidence/$path" "$RUNNER_TEMP/$path"
            printf 'X' >> "evidence/$path"
            if native/target/release/pnp-native source-verify evidence > "$RUNNER_TEMP/source-tamper.hbp" 2>&1; then
              echo "PNP_SOURCE_TAMPER_FAIL|file=$path|json=0"
              exit 1
            fi
            cp "$RUNNER_TEMP/$path" "evidence/$path"
          done
          cp source-train/models/gslgnn_w9_3_seq47_v2.pt "$RUNNER_TEMP/original-gsl.pt"
          printf 'X' >> source-train/models/gslgnn_w9_3_seq47_v2.pt
          if native/target/release/pnp-native source-attest source-train source-stage evidence > "$RUNNER_TEMP/checkpoint-tamper.hbp" 2>&1; then
            echo 'PNP_SOURCE_TAMPER_FAIL|file=checkpoint|json=0'
            exit 1
          fi
          cp "$RUNNER_TEMP/original-gsl.pt" source-train/models/gslgnn_w9_3_seq47_v2.pt
          native/target/release/pnp-native source-verify evidence >/dev/null
          ( cd evidence && sha256sum -c PNP_SOURCE_DIGESTS.sha256 )
          echo 'PNP_SOURCE_NEGATIVE|hbp=REJECTED|hbi=REJECTED|anchor=REJECTED|checkpoint=REJECTED|restored=PASS|json=0'
      - name: Source-matched integer SHA baseline and reverse-gain HBI HBP receipts
        run: |
          set -euo pipefail
          native/target/release/pnp-native score-attest native/fixtures/SOURCE_SCORE_VECTORS.hbi evidence evidence | tee PNP_SCORE_ATTEST.hbp
          native/target/release/pnp-native score-verify native/fixtures/SOURCE_SCORE_VECTORS.hbi evidence evidence | tee PNP_SCORE_REPLAY.hbp
          grep -Fq 'PNP_SOURCE_SCORE|cases=9|source_pins=23|source_blob=VERIFIED|sha_baseline=EXACT|reverse_gain=EXACT|hbi=PASS|hbp=PASS|sha256=PASS|sh=PASS|hash_chain=PASS|trained_gnn=HOLD|status=PASS|json=0' PNP_SCORE_ATTEST.hbp
          grep -Fq 'PNP_SCORE_VERIFY|cases=9|sha_baseline=EXACT|reverse_gain=EXACT|hbi=PASS|hbp=PASS|hash_chain=PASS|status=PASS|json=0' PNP_SCORE_REPLAY.hbp
          test "$(grep -c '^SCORE|' evidence/PNP_SCORE.hbp)" -eq 9
          test "$(grep -c '^HBI|' evidence/PNP_SCORE.hbi)" -eq 9
          grep -Fq '|baseline_q=8190|reverse_q=1810|promoted=1|mark=GENIUS|' evidence/PNP_SCORE.hbp
          cp evidence/PNP_SCORE.hbp "$RUNNER_TEMP/frozen-score.hbp"
          cp evidence/PNP_SCORE.hbi "$RUNNER_TEMP/frozen-score.hbi"
          cp evidence/PNP_SCORE.anchor "$RUNNER_TEMP/frozen-score.anchor"
          native/target/release/pnp-native score-attest native/fixtures/SOURCE_SCORE_VECTORS.hbi evidence evidence > "$RUNNER_TEMP/repeat-score.hbp"
          cmp evidence/PNP_SCORE.hbp "$RUNNER_TEMP/frozen-score.hbp"
          cmp evidence/PNP_SCORE.hbi "$RUNNER_TEMP/frozen-score.hbi"
          cmp evidence/PNP_SCORE.anchor "$RUNNER_TEMP/frozen-score.anchor"
          ( cd evidence && sha256sum PNP_SCORE.hbp PNP_SCORE.hbi PNP_SCORE.anchor > PNP_SCORE_DIGESTS.sha256 )
          ( cd evidence && sha256sum -c PNP_SCORE_DIGESTS.sha256 )
          echo 'HBIHEADER|schema=pnp.score.cases.v1|source_blob=b101c0989de3af0ca41db0eac1293c758d7e5296|seal=HBI-HBP-SHA-SH-HASH|json=0' > "$RUNNER_TEMP/UNSEEN.hbi"
          echo 'CASE|id=fresh|pid_hex=666f6f|content_hex=626172|baseline_q=none|reverse_q=none|mark=none|json=0' >> "$RUNNER_TEMP/UNSEEN.hbi"
          native/target/release/pnp-native score-attest "$RUNNER_TEMP/UNSEEN.hbi" evidence "$RUNNER_TEMP/unseen" > "$RUNNER_TEMP/fresh-score.hbp"
          native/target/release/pnp-native score-verify "$RUNNER_TEMP/UNSEEN.hbi" evidence "$RUNNER_TEMP/unseen" > /dev/null
          grep -Fq 'baseline_sha256=0fc7e25e075c7849f89b9729d1aeada1c4d791893248a042f8025c35f26b635f|sh=0fc7e25e075c7849|baseline_q=390|reverse_q=9610|promoted=0|mark=MISTAKE|' "$RUNNER_TEMP/unseen/PNP_SCORE.hbp"
          test "$(grep -c '^SCORE|' "$RUNNER_TEMP/unseen/PNP_SCORE.hbp")" -eq 1
          echo 'PNP_SCORE_FRESH|input=UNSEEN|source_authenticated=PASS|integer_output=EXACT|hbi=PASS|hbp=PASS|json=0'
          echo 'PNP_SCORE_REFERENCE|original_source=PINNED|integer_q=EXACT|cases=9|byte_replay=PASS|json=0'
      - name: Independent original-score evidence corruption controls
        run: |
          set -euo pipefail
          for path in PNP_SCORE.hbp PNP_SCORE.hbi PNP_SCORE.anchor; do
            cp "evidence/$path" "$RUNNER_TEMP/$path"
            printf 'X' >> "evidence/$path"
            if native/target/release/pnp-native score-verify native/fixtures/SOURCE_SCORE_VECTORS.hbi evidence evidence > "$RUNNER_TEMP/score-tamper.hbp" 2>&1; then
              echo "PNP_SCORE_NEGATIVE_FAIL|path=$path|json=0"
              exit 1
            fi
            cp "$RUNNER_TEMP/$path" "evidence/$path"
          done
          cp native/fixtures/SOURCE_SCORE_VECTORS.hbi "$RUNNER_TEMP/source-score.hbi"
          sed -i 's/baseline_q=8190/baseline_q=8191/' native/fixtures/SOURCE_SCORE_VECTORS.hbi
          if native/target/release/pnp-native score-verify native/fixtures/SOURCE_SCORE_VECTORS.hbi evidence evidence > "$RUNNER_TEMP/score-oracle-tamper.hbp" 2>&1; then
            echo 'PNP_SCORE_NEGATIVE_FAIL|oracle=altered|json=0'
            exit 1
          fi
          cp "$RUNNER_TEMP/source-score.hbi" native/fixtures/SOURCE_SCORE_VECTORS.hbi
